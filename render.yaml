# FinPilot AI — Render Blueprint
# Deploys: Backend (FastAPI), Frontend (Next.js), PostgreSQL, Redis
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  - type: web
    name: finpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          name: finpilot-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: finpilot-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: finpilot-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FIRST_SUPERUSER_EMAIL
        value: admin@finpilot.ai
      - key: FIRST_SUPERUSER_PASSWORD
        generateValue: true

  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  - type: web
    name: finpilot-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    region: oregon
    buildArgs:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
    envVars:
      - key: NODE_ENV
        value: production

  # ── Redis ─────────────────────────────────────────────────────────────────────
  - type: redis
    name: finpilot-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  - name: finpilot-db
    plan: starter
    region: oregon
    databaseName: finpilot
    user: finpilot
